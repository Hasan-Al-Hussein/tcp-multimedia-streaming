<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">TCP Multimedia Streaming</title>
  <desc id="desc">Multithreaded C  /  routed subnets  /  packet-level validation</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#061526"/><stop offset=".55" stop-color="#09263b"/><stop offset="1" stop-color="#06111e"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#24d6ff"/><stop offset="1" stop-color="#ffb86b"/></linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#b8e7ff" stroke-opacity=".06"/></pattern>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="300" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="22" fill="url(#grid)"/>
  <path d="M0 250C220 215 370 282 590 247S960 222 1200 255V300H0Z" fill="#0b3550" fill-opacity=".45"/>
  <path d="M0 272C230 229 382 290 603 263S955 240 1200 271" fill="none" stroke="url(#accent)" stroke-opacity=".5" stroke-width="2"/>

  <g transform="translate(52 42)">
    <text x="0" y="18" fill="#24d6ff" font-family="Consolas, 'Courier New', monospace" font-size="14" font-weight="700" letter-spacing="3">SYSTEMS + NETWORKING</text>
    <text x="0" y="88" fill="#f6fbff" font-family="Segoe UI, Arial, sans-serif" font-size="40" font-weight="750">TCP Multimedia Streaming</text>
    <rect x="0" y="106" width="660" height="3" rx="2" fill="url(#accent)"/>
    <text x="0" y="150" fill="#bbd0dc" font-family="Segoe UI, Arial, sans-serif" font-size="19">Multithreaded C  /  routed subnets  /  packet-level validation</text>
    <text x="0" y="199" fill="#6f96aa" font-family="Consolas, 'Courier New', monospace" font-size="12">HASAN-AL-HUSSEIN / ENGINEERING PORTFOLIO</text>
  </g>

  <g transform="translate(770 74)" font-family="Consolas, 'Courier New', monospace" font-size="11" text-anchor="middle">
    <path d="M58 75H151M209 75H302" stroke="#5b8295" stroke-width="2" stroke-dasharray="5 6"/>
    <circle r="4" fill="#24d6ff" filter="url(#glow)"><animateMotion dur="2.6s" repeatCount="indefinite" path="M58 75H151"/></circle>
    <circle r="4" fill="#ffb86b" filter="url(#glow)"><animateMotion dur="2.6s" begin="1.3s" repeatCount="indefinite" path="M209 75H302"/></circle>
    <g><rect x="0" y="42" width="116" height="66" rx="14" fill="#0b2d43" stroke="#24d6ff"/><circle cx="58" cy="23" r="7" fill="#24d6ff" filter="url(#glow)"><animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/></circle><text x="58" y="81" fill="#e8f8ff">ENCODE</text></g>
    <g><rect x="151" y="42" width="116" height="66" rx="14" fill="#0b2d43" stroke="url(#accent)"/><circle cx="209" cy="23" r="7" fill="#ffb86b" filter="url(#glow)"><animate attributeName="opacity" values="1;.3;1" dur="1.8s" repeatCount="indefinite"/></circle><text x="209" y="81" fill="#e8f8ff">TRANSPORT</text></g>
    <g><rect x="302" y="42" width="116" height="66" rx="14" fill="#0b2d43" stroke="#ffb86b"/><circle cx="360" cy="23" r="7" fill="#24d6ff" filter="url(#glow)"><animate attributeName="r" values="5;9;5" dur="2.2s" repeatCount="indefinite"/></circle><text x="360" y="81" fill="#e8f8ff">PLAYBACK</text></g>
    <text x="209" y="151" fill="#6f96aa" font-size="11" letter-spacing="2">EVIDENCE  /  ARCHITECTURE  /  RESULTS</text>
  </g>
</svg>